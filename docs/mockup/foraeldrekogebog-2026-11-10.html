<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tumbi Køkken — mockup af forældrekogebog</title>
<style>
/* ===== Tokens: lys er standard, mørk efter systemet eller knappen i demo-linjen ===== */
:root {
  --skrift: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  /* Børnedelen (som i appen i dag) */
  --kakao: #3B2A20; --kakao-blid: #6B5545; --creme: #FFF4E2; --creme-moerk: #EEDDBF; --hvid: #FFFFFF;
  --sennep: #F2C14E; --sennep-lys: #FBEBC2; --raev: #F08A3C; --urt: #5BAA6A; --urt-lys: #DDEFE0; --tomat: #E2513B; --tomat-lys: #F9DCD6;
  --blaa-lys: #D9EBF2; --lilla-lys: #EADFF4; --dej-lys: #F6E7D0;
  --tryk: 64px;
  /* Forældredelen: roligt, voksent */
  --p-bg: #F6F3EE; --p-flade: #FFFFFF; --p-flade2: #F0ECE5; --p-tekst: #26201B; --p-blid: #6E655C; --p-streg: #DDD6CC;
  --p-accent: #F2C14E; --p-accent-tekst: #26201B; --p-ok: #3E8E55; --p-ok-lys: #E3F1E6; --p-advar: #B9482F; --p-advar-lys: #FBE4DE;
  --p-skygge: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.05);
  --p-radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="lys"]) {
    --p-bg: #17161A; --p-flade: #232227; --p-flade2: #2C2B31; --p-tekst: #F1EEE9; --p-blid: #A9A39B; --p-streg: #3A383F;
    --p-accent: #E6B445; --p-accent-tekst: #1A1710; --p-ok: #6CC083; --p-ok-lys: #1F3326; --p-advar: #E07A62; --p-advar-lys: #3A2420;
    --p-skygge: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.35);
  }
}
:root[data-tema="moerk"] {
  --p-bg: #17161A; --p-flade: #232227; --p-flade2: #2C2B31; --p-tekst: #F1EEE9; --p-blid: #A9A39B; --p-streg: #3A383F;
  --p-accent: #E6B445; --p-accent-tekst: #1A1710; --p-ok: #6CC083; --p-ok-lys: #1F3326; --p-advar: #E07A62; --p-advar-lys: #3A2420;
  --p-skygge: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--skrift); background: var(--p-bg); color: var(--p-tekst); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ===== Demo-linjen (kun i mockuppen) ===== */
.demo { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; gap: 6px; align-items: center; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); background: #1F1D22; color: #EEE; font-size: 13px; }
.demo .mellem { flex: 1; text-align: center; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo button { min-height: 30px; padding: 0 10px; border: 1px solid #555; border-radius: 8px; background: #2C2A31; color: #EEE; font-size: 13px; }
.demo button[aria-pressed="true"] { background: #F2C14E; color: #1F1D22; border-color: #F2C14E; }
.app { padding-top: 44px; min-height: 100vh; }

/* ======================= FORÆLDREDELEN ======================= */
.p { display: grid; grid-template-rows: 1fr auto; min-height: calc(100vh - 44px); background: var(--p-bg); color: var(--p-tekst); font-size: 17px; line-height: 1.35; }
.p-side { padding: 16px 16px 24px; max-width: 760px; width: 100%; margin: 0 auto; }
.p h1 { font-size: 26px; margin: 4px 0 2px; letter-spacing: -.01em; }
.p h2 { font-size: 15px; font-weight: 700; color: var(--p-blid); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }
.p .under { color: var(--p-blid); margin: 0 0 12px; font-size: 15px; }
.p-hoved { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Knapper til voksne: mindst 48 px, tynd streg, én accent */
.pk { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 1.5px solid var(--p-streg); border-radius: 12px; background: var(--p-flade); font-weight: 700; font-size: 16px; }
.pk:active { transform: translateY(1px); }
.pk.primaer { background: var(--p-accent); color: var(--p-accent-tekst); border-color: transparent; }
.pk.lille { min-height: 44px; padding: 0 12px; font-size: 15px; }
.pk.rund { width: 44px; min-height: 44px; padding: 0; border-radius: 50%; font-size: 20px; }
.pk.ikon { width: 48px; padding: 0; font-size: 22px; }
.pk[aria-pressed="true"] { background: var(--p-tekst); color: var(--p-bg); border-color: var(--p-tekst); }
.pk.hjerte[aria-pressed="true"] { background: var(--tomat-lys); color: var(--tomat); border-color: var(--tomat); }
:root[data-tema="moerk"] .pk.hjerte[aria-pressed="true"] { background: #3A2420; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="lys"]) .pk.hjerte[aria-pressed="true"] { background: #3A2420; } }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 15px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
.raekke-knapper { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.kort { background: var(--p-flade); border: 1.5px solid var(--p-streg); border-radius: var(--p-radius); box-shadow: var(--p-skygge); }
.liste { list-style: none; margin: 0; padding: 0; }
.liste > li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1.5px solid var(--p-streg); min-height: 64px; }
.liste > li:first-child { border-top: 0; }
.emoji { font-size: 32px; width: 44px; text-align: center; flex: none; line-height: 1; }
.navn { font-weight: 700; }
.meta { color: var(--p-blid); font-size: 14px; }
.tekst { flex: 1; min-width: 0; }
.tekst .navn, .tekst .meta { display: block; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--p-flade2); border: 1.5px solid var(--p-streg); font-size: 14px; font-weight: 700; }
.status-chip.ok { background: var(--p-ok-lys); color: var(--p-ok); border-color: transparent; }

/* Ugen */
.dag { align-items: stretch; }
.dag-hoved { width: 72px; flex: none; display: flex; flex-direction: column; justify-content: center; }
.dag-hoved b { font-size: 15px; }
.dag-hoved span { color: var(--p-blid); font-size: 13px; }
.dag.fri .tekst .navn { color: var(--p-blid); font-weight: 500; }
.dag.idag { background: var(--p-flade2); }
.af { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--p-blid); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper output { min-width: 56px; text-align: center; font-weight: 700; font-size: 15px; }
@media (max-width: 480px) { .dag .tekst .meta { display: none; } .dag-hoved { width: 64px; } }
.sum { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; color: var(--p-blid); font-size: 15px; }

/* Indkøb */
.afd { margin-top: 14px; }
.afd h3 { margin: 0; padding: 10px 12px; font-size: 15px; color: var(--p-blid); background: var(--p-flade2); border-bottom: 1.5px solid var(--p-streg); border-radius: var(--p-radius) var(--p-radius) 0 0; display: flex; justify-content: space-between; }
.vare { cursor: pointer; }
.vare .boks { width: 28px; height: 28px; border: 2px solid var(--p-streg); border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 18px; }
.vare.koebt { opacity: .5; }
.vare.koebt .navn { text-decoration: line-through; }
.vare.koebt .boks { background: var(--p-ok); border-color: var(--p-ok); color: #fff; }
.fremdrift { height: 8px; border-radius: 4px; background: var(--p-flade2); overflow: hidden; margin: 8px 0 4px; }
.fremdrift > span { display: block; height: 100%; background: var(--p-ok); width: 0; transition: width .2s; }
.menu { position: relative; }
.menu-liste { position: absolute; right: 0; top: 52px; z-index: 5; min-width: 220px; padding: 6px; background: var(--p-flade); border: 1.5px solid var(--p-streg); border-radius: 12px; box-shadow: var(--p-skygge); }
.menu-liste button { display: flex; width: 100%; min-height: 48px; align-items: center; gap: 10px; padding: 0 12px; border: 0; background: none; border-radius: 8px; font-weight: 600; text-align: left; }
.menu-liste button:hover { background: var(--p-flade2); }
.besked { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--p-ok-lys); color: var(--p-ok); font-weight: 600; font-size: 15px; }

/* Retter */
.soeg { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border: 1.5px solid var(--p-streg); border-radius: 12px; background: var(--p-flade); }
.soeg input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: inherit; outline: none; }
.maerke { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--p-flade2); font-size: 12px; font-weight: 700; margin-right: 4px; }

/* Mere */
.indst { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-top: 1.5px solid var(--p-streg); min-height: 64px; flex-wrap: wrap; }
.indst:first-child { border-top: 0; }
.indst .tekst .meta { margin-top: 2px; }
.kontakt { width: 56px; height: 32px; border-radius: 16px; background: var(--p-streg); border: 0; position: relative; flex: none; }
.kontakt::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--p-flade); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.kontakt[aria-checked="true"] { background: var(--p-ok); }
.kontakt[aria-checked="true"]::after { left: 27px; }
.valg-par { display: inline-flex; gap: 6px; }

/* Fanelinjen: nederst på telefon, til venstre på bred skærm */
.faner { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom)); background: var(--p-flade); border-top: 1.5px solid var(--p-streg); }
.fane { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; border: 0; border-radius: 10px; background: none; font-size: 12px; font-weight: 700; color: var(--p-blid); }
.fane span:first-child { font-size: 22px; }
.fane[aria-current="page"] { color: var(--p-tekst); background: var(--p-flade2); }
.laas-info { font-size: 13px; color: var(--p-blid); display: none; align-items: center; gap: 4px; }
.p-hoved .laas-info { display: inline-flex; }
@media (min-width: 900px) {
  .p { grid-template-rows: none; grid-template-columns: 200px 1fr; }
  .faner { position: sticky; top: 44px; align-self: start; grid-column: 1; grid-row: 1; grid-template-columns: 1fr; gap: 6px; height: calc(100vh - 44px); padding: 16px 10px; border-top: 0; border-right: 1.5px solid var(--p-streg); align-content: start; }
  .fane { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 0 12px; font-size: 16px; min-height: 52px; }
  .fane span:first-child { font-size: 22px; }
  .p-side { grid-column: 2; max-width: 900px; padding: 24px 32px 40px; }
  .faner .laas-info { display: inline-flex; margin-top: auto; padding: 0 12px; }
}

/* ======================= BØRNEDELEN ======================= */
.b { min-height: calc(100vh - 44px); background: var(--creme); color: var(--kakao); font-size: 20px; --streg: 3px; --kant: var(--streg) solid var(--kakao); --loeft: 0 5px 0 var(--kakao); }
.b-top { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 16px; background: repeating-linear-gradient(90deg, var(--sennep-lys) 0 24px, #F7D98A 24px 48px); border-bottom: var(--kant); }
.b-titel { padding: 6px 22px; background: var(--creme); border: var(--kant); border-radius: 22px; text-align: center; }
.b-titel h1 { margin: 0; font-size: 30px; }
.b-titel p { margin: 0; font-size: 15px; color: var(--kakao-blid); }
.b-dyr { font-size: 48px; line-height: 1; }
.b-indhold { padding: 16px; max-width: 1100px; margin: 0 auto; }

.bk { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--tryk); min-width: var(--tryk); padding: 0 22px; border: var(--kant); border-radius: 999px; background: var(--hvid); box-shadow: var(--loeft); font-weight: 800; font-size: 20px; }
.bk:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--kakao); }
.bk.primaer { background: var(--sennep); }
.bk.lille { min-height: 48px; min-width: 48px; font-size: 16px; padding: 0 16px; box-shadow: 0 3px 0 var(--kakao); }

/* I dag-kortet */
.idag { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 14px 18px; border: var(--kant); border-radius: 28px; background: var(--hvid); box-shadow: var(--loeft); margin-bottom: 18px; }
.idag .tallerken { width: 96px; height: 96px; border-radius: 50%; background: var(--urt-lys); border: var(--kant); display: grid; place-items: center; font-size: 56px; }
.idag .lille-tekst { font-size: 15px; color: var(--kakao-blid); font-weight: 700; }
.idag .stor { font-size: 28px; font-weight: 800; line-height: 1.1; }
.idag.tom { background: var(--creme-moerk); box-shadow: none; }

.grupper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.gruppe { width: 100%; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: var(--kant); border-radius: 28px; box-shadow: var(--loeft); font-weight: 800; font-size: 19px; padding: 10px; }
.gruppe .cirkel { width: 84px; height: 84px; border-radius: 50%; background: var(--hvid); border: var(--kant); display: grid; place-items: center; font-size: 46px; }
.b-bund { display: flex; justify-content: center; padding: 22px 16px; }
.hold { position: relative; overflow: hidden; }
.hold .fyld { position: absolute; inset: 0; width: 0; background: var(--sennep); transition: none; }
.hold .hold-indhold { position: relative; }

/* Børnenes valg */
.valg-hoved { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 8px 0 18px; }
.valg-hoved h2 { margin: 0; font-size: 34px; }
.dyr-gitter, .kort-gitter { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.dyr-gitter { grid-template-columns: repeat(3, 1fr); max-width: 900px; margin: 0 auto; }
.dyr-kort { width: 100%; min-height: 220px; padding: 16px 12px; border: var(--kant); border-radius: 28px; background: var(--hvid); box-shadow: var(--loeft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 24px; font-weight: 800; }
.dyr-kort .cirkel { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; font-size: 72px; border: var(--kant); }
.dyr-kort .plads { width: 40px; height: 40px; border-radius: 50%; border: 3px dashed var(--kakao-blid); display: grid; place-items: center; font-size: 24px; }
.dyr-kort .plads.fyldt { border-style: solid; background: var(--urt-lys); }
.dyr-kort.faerdig { opacity: .75; }
.kort-gitter { grid-template-columns: repeat(2, 1fr); max-width: 980px; margin: 0 auto; }
@media (min-width: 900px) { .kort-gitter { grid-template-columns: repeat(4, 1fr); } }
.ret-kort { position: relative; width: 100%; min-height: 190px; border: var(--kant); border-radius: 28px; background: var(--hvid); box-shadow: var(--loeft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 20px; font-weight: 800; }
.ret-kort .tallerken { width: 110px; height: 110px; border-radius: 50%; background: var(--creme); border: var(--kant); display: grid; place-items: center; font-size: 64px; }
.ret-kort[aria-pressed="true"] { background: var(--sennep-lys); box-shadow: inset 0 0 0 3px var(--kakao), var(--loeft); }
.ret-kort .mk { position: absolute; top: 10px; left: 10px; width: 44px; height: 44px; border-radius: 50%; border: var(--kant); background: var(--urt-lys); display: grid; place-items: center; font-size: 22px; }
.ret-kort .mk.fav { background: var(--tomat-lys); }
.valg-bund { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.prikker { display: flex; gap: 8px; justify-content: center; }
.prikker span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--kakao); }
.prikker span.nu { background: var(--kakao); }
.dage { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.dag-brik { width: 100%; min-height: 150px; border: var(--kant); border-radius: 22px; box-shadow: var(--loeft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 18px; }
.dag-brik .t { width: 60px; height: 60px; border-radius: 50%; border: var(--kant); background: var(--hvid); display: grid; place-items: center; font-size: 34px; }
.dag-brik.optaget { opacity: .7; }
@media (max-width: 600px) { .dage { grid-template-columns: repeat(4, 1fr); } .dyr-gitter { grid-template-columns: 1fr; } .dyr-kort { min-height: 120px; flex-direction: row; } .dyr-kort .cirkel { width: 80px; height: 80px; font-size: 48px; } }
/* Liggende telefon: 88 px børneknapper som i appen */
@media (max-height: 500px) and (orientation: landscape) { .b { --tryk: 88px; } }
.laes-op { font-size: 18px; }
.tale { position: fixed; left: 12px; bottom: 12px; z-index: 40; max-width: 60vw; padding: 8px 14px; border-radius: 14px; background: var(--kakao); color: var(--creme); font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.tale.vis { opacity: 1; }
</style>
</head>
<body>

<div class="demo" role="toolbar" aria-label="Mockup-valg">
  <button type="button" id="dm-f" aria-pressed="true">Forældre</button>
  <button type="button" id="dm-b" aria-pressed="false">Børn</button>
  <span class="mellem">Mockup · klik rundt · opdigtede retter</span>
  <button type="button" id="dm-t">Tema: auto</button>
</div>

<div class="app" id="app"></div>
<div class="tale" id="tale" aria-live="polite"></div>

<script>
/* ===================== Opdigtede data (ingen rigtige navne) ===================== */
const RETTER = [
  { id: 'maanepasta',   navn: 'Månepasta',               e: '🍝', min: 25, kr: 45, g: 180, gruppe: 'Pasta',   mk: ['hurtig','vegetar'],        fav: true },
  { id: 'regnbuesuppe', navn: 'Regnbuesuppe',            e: '🍲', min: 30, kr: 38, g: 320, gruppe: 'Grønt',   mk: ['vegetar','groent','billig'], fav: true },
  { id: 'dragetacos',   navn: 'Drage-tacos',             e: '🌮', min: 30, kr: 70, g: 150, gruppe: 'Kød',     mk: [],                         fav: true },
  { id: 'skovboller',   navn: 'Skovboller med suppe',    e: '🥖', min: 40, kr: 42, g: 200, gruppe: 'Brød',    mk: ['vegetar'],                fav: false },
  { id: 'solskinsris',  navn: 'Solskinsris med kylling', e: '🍛', min: 35, kr: 62, g: 220, gruppe: 'Kylling', mk: ['groent'],                 fav: true },
  { id: 'fiskepakker',  navn: 'Sø-fiskepakker',          e: '🐟', min: 35, kr: 78, g: 260, gruppe: 'Fisk',    mk: ['groent','kniv'],          fav: true },
  { id: 'pandekager',   navn: 'Rosas pandekager',        e: '🥞', min: 45, kr: 30, g: 0,   gruppe: 'Brød',    mk: ['vegetar','billig','kniv'],fav: true },
  { id: 'kartoffel',    navn: 'Pips kartoffelbåde',      e: '🥔', min: 40, kr: 35, g: 300, gruppe: 'Grønt',   mk: ['vegetar','groent','kniv','billig'], fav: true },
  { id: 'boennegryde',  navn: 'Tigerbønne-gryde',        e: '🫘', min: 30, kr: 33, g: 280, gruppe: 'Grønt',   mk: ['vegetar','groent','billig'], fav: true },
  { id: 'bjoernegryde', navn: 'Bjørnegryde',             e: '🥘', min: 45, kr: 85, g: 170, gruppe: 'Kød',     mk: [],                         fav: false },
